name: 비서실장 일일 브리핑

on:
  schedule:
    # 07:00 KST(UTC+9), 월~금. 일~목 22:00 UTC = 월~금 07:00 KST
    - cron: '0 22 * * 0-4'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 업무 데이터 수집 및 대시보드 생성
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO: ${{ github.repository }}
        run: python secretary/collect.py

      - name: 변경사항 커밋
        run: |
          git config user.name "비서실장 (자동화)"
          git config user.email "actions@users.noreply.github.com"
          git add data/dashboard.json docs/index.html
          git diff --cached --quiet || git commit -m "chore: 일일 업무 현황 갱신 $(date -u +%Y-%m-%d)"
          git push

      - name: Slack 요약 발송
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
        run: python secretary/notify_slack.py
